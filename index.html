<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css">

	<title>Grade Sheet Using JavaScript</title>

	<style>


		body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
		
		table{
			width:70%;
			min-height:500px;
			margin:auto;
			border:2px solid #999;
			border-collapse: collapse;
			margin-top: 40px;
			border-radius: 15px;

		}

		th{
			border:2px solid #999;
			font-size:20px;
			font-weight:700;


		}

		td, th{
			text-align: center;
		}



		input[type="number"] {
      width: 100px;
      padding: 5px;
    }

    input[type="text"]{
    	padding:5px;
    	width:400px;
    }

		tr td input{
			margin:20px;
			font-size: 25px;
			font-weigth:700;
		}

		img{
			width:100px;
			height:100px;

		}

		th p{
			color:#dbb314;
			margin-top:5px;
		}


	</style>
</head>
<body>
 <table>

 	<tr>
 			<th colspan="2"><img src="image/schoolbadge.png" alt="schl_pic"><p>Mariette Schools, England<p></th>

 			<td><input type="text" id="adm" class="form-control" placeholder="Enter Admission Number"></input></td>

 			
 	</tr>
 	
 	<tr>
 		<th>Subject</th>
 		<th>Score</th>
 		<th>Grade</th>
 	<tr>

 	<tr>
 		<td>English</td>
 		<td><input type="number" id="num1" class="form-control" oninput="getGrade('num1', 'eng')"></input></td>
 		<td><input type="text" id="eng" class="form-control" readonly></input></td>
 	<tr>

 	<tr>
 		<td>Maths</td>
 		<td><input type="number" id="num2" class="form-control" oninput="getGrade('num2', 'maths')"></input></td>
 		<td><input type="text" id="maths" class="form-control" readonly></input></td>
 	<tr>

 	<tr>

 		<td>Chemistry</td>
 		<td><input type="number" id="num3" class="form-control" oninput="getGrade('num3', 'chem')"></input></td>
 		<td><input type="text" id="chem" class="form-control" readonly></input></td>
 	<tr>
 	<tr>
 		<td>Biology</td>
 		<td><input type="number" id="num4" class="form-control" oninput="getGrade('num4', 'bio')"></input></td>
 		<td><input type="text" id="bio" class="form-control" readonly></input></td>
 	<tr>
 	<tr>
 		<td>French</td>
 		<td><input type="number" id="num5" class="form-control" oninput="getGrade('num5', 'fr')"></input></td>
 		<td><input type="text" id="fr" class="form-control" readonly></input></td>
 	<tr>

 	<tr>
 		<td colspan="3" style="text-align:center;">
 			<button type="button" class="btn btn-success" onclick="getResult()">Get Result</button>
 		</td>
 	</tr>

 	<tr>
 		<td id="tot">TOTAL:</td>
 		<td colspan="2"><p id="total"></p></td>
 	</tr>

 	<tr>
 		<td>Average:</td>
 		<td colspan="2"><p id="average"></p></td>

 	</tr>


 	<tr>
 		<td>Class Teacher Remark:</td>
 		<td colspan="2"><p id="remark"></p></td>
 	</tr>

 	<tr>
 		<td>Head Teacher Remark:</td>
 		<td colspan="2"><p id="remark2"></p></td>
 	</tr>

 </table>

<script type="text/javascript">

 function calculateGrade(score) {
      if (score >= 70) return 'A';
      if (score >= 60) return 'B';
      if (score >= 50) return 'C';
      if (score >= 45) return 'D';
      if (score >= 40) return 'E';
      if (score < 40) return 'F';
      return '';
    }


//inputId == num1, num2 ... also gradeInputId = 'eng', 'maths'...
 function getGrade(inputId, gradeInputId) {
      var score = Number(document.getElementById(inputId).value);
      var grade = calculateGrade(score);
      document.getElementById(gradeInputId).value = grade;
  }


function getResult() {
 	const scores = [
 		Number(document.getElementById('num1').value),
 		Number(document.getElementById('num2').value),
 		Number(document.getElementById('num3').value),
 		Number(document.getElementById('num4').value),
 		Number(document.getElementById('num5').value)
  ];


  var Total_Score = scores.reduce((a, b) => a + b, 0);
  var Average_Score = Total_Score /scores.length;
  var adm = Number(document.getElementById('adm').value);


  document.getElementById('total').innerText = Total_Score;
  document.getElementById('average').innerText = Average_Score;
  document.getElementById('remark').innerText = Average_Score > 50 ? 'You Impressed Your Teacher ' : ' You Disappoint Your Teacher';
  document.getElementById('remark2').innerText = Average_Score > 50 ? 'Candidate with Admission No: ' + adm + ' Passed' : 'Candidate with Admission No: ' + adm + ' Failed';
}



</script>
</body>
</html>
